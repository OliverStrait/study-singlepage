<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="theme-base" rel="stylesheet" href="base.css">
    <link id="theme-stylesheet" rel="stylesheet" href="style2.css">
    <title>CV template study</title>
</head>

<body>
    <main>
        <aside class="desc">

            <div class="hero-image">
                <img class="circular"
                    src="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                    title="CC BY-SA 2.0 Hisashi ">
            </div>
            <cv-name id="cv-name"></cv-name>

            <cv-style-picker>
                <label>
                    Appearance
                    <select aria-label="Choose appearance">
                        <option value="style1.css">Classic</option>
                        <option value="style2.css" selected>Modern</option>
                        <option value="style3.css">Synthwave '80s</option>
                    </select>
                </label>
            </cv-style-picker>
            <cv-data-picker>
                <label>
                    Used data
                    <select aria-label="Choose data">
                        <option value="example_data1.json" selected>example 1</option>
                        <option value="example_data2.json">example 2</option>
                        <option value="example_data3.json">example 3</option>
                        <option value="data_real.json">real data</option>
                    </select>
                </label>
            </cv-data-picker>
            <cv-personal-info id="personal-info" class="personal-info"></cv-personal-info>
            <cv-link-list id="side_links" class="link-list"></cv-link-list>
            <cv-link-list id="side_harrastukset" class="link-list"></cv-link-list>

        </aside>
        <article>
            <section class="story module">
                <cv-story id="main-story">
                    <h2>Static description</h2>
                    <p>Lorem master, ipsum ipsum, dolor sit amet consectetur adipisicing elit. Odit quasi est ut
                        placeat.
                        Ad, atque quod
                        possimus, exercitationem nam totam ipsam officia id alias, vitae nesciunt animi vero veritatis
                        optio.</p>

                </cv-story>
            </section>
            <cv-skill-list class="year-list module story skill-listing" id="it-taidot">
                <!-- Runtime content -->
                <noscript>
                    <p>content is rendered with Javascript</p>
                </noscript>
            </cv-skill-list>

            <cv-timeline-list class="year-list module" id="education"></cv-timeline-list>
            <cv-timeline-list class="year-list module" id="courses"></cv-timeline-list>
            <cv-timeline-list class="year-list module" id="jobs"></cv-timeline-list>

        </article>

    </main>
    <p class="footer note">Document rendered with: Html, Css, JavaScript
        Json</p>


    <template id="link-list-template">
        <h4 class="side-header"></h4>
        <ul class="colort"></ul>
    </template>
    <template id="link-list-item-template">
        <li><a></a><b></b></li>
    </template>
    <template id="personal-info-template">
        <ul></ul>
    </template>
    <template id="personal-info-item-template">
        <li><b></b><a></a></li>
    </template>
    <template id="skill-list-template">
        <h3></h3>
        <ul></ul>
    </template>
    <template id="skill-item-template">
        <li>
            <p><a></a><b></b></p>
        </li>
    </template>
    <template id="timeline-list-template">
        <h3></h3>
        <ul></ul>
    </template>
    <template id="timeline-item-template">
        <li><span class="year"></span>
            <p class="description"><a></a></p>
            <p class="period"></p>
        </li>
    </template>
    <template id="cv-main-story">
        <h2></h2>
        <div></div>
    </template>

    <script src="template_builder.js"></script>
    <script>
        class CvDataPicker extends HTMLElement {
            constructor() {
                super()
                this.handleChange = () => this.loadSelectedData()
                this.select = null
            }

            connectedCallback() {
                this.select = this.querySelector("select")
                if (!this.select) return

                this.select.addEventListener("change", this.handleChange)
                this.loadSelectedData()
            }

            disconnectedCallback() {
                this.select?.removeEventListener("change", this.handleChange)
            }

            async loadSelectedData() {
                if (!this.select) return

                const fileName = this.select.value
                if (!fileName) return

                try {
                    const response = await fetch(fileName)
                    if (!response.ok) {
                        throw new Error(`Failed to load ${fileName}: ${response.status}`)
                    }

                    const data = await response.json()
                    this.applyData(data)
                } catch (error) {
                    console.error("Could not load data file", fileName, error)
                }
            }

            applyData(data) {
                const targets = {
                    personInfo: document.querySelector("#personal-info"),
                    personalLinks: document.querySelector("#side_links"),
                    hobbies: document.querySelector("#side_harrastukset"),
                    programming: document.querySelector("#it-taidot"),
                    education: document.querySelector("#education"),
                    courses: document.querySelector("#courses"),
                    jobs: document.querySelector("#jobs"),
                    name: document.querySelector("#cv-name"),
                    story: document.querySelector("#main-story")
                }

                for (const [key, element] of Object.entries(targets)) {
                    const hasKey = Object.prototype.hasOwnProperty.call(data ?? {}, key)
                    if (element && hasKey) {
                        try { element.data = data[key] }
                        catch (e) { }
                        finally { continue }
                    }
                    if (element) {
                        element.data = null
                    }
                }
            }
        }

        customElements.define("cv-data-picker", CvDataPicker)
    </script>
</body>


</html>
